# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG — полностью прокомментирован (каждая строка)
# #######################################################################################

# ===== ОБЯЗАТЕЛЬНЫЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (NVIDIA) =====
# Эти переменные необходимы для корректной работы проприетарного драйвера NVIDIA
# и аппаратного ускорения в окружении Wayland.
env = LIBVA_DRIVER_NAME,nvidia                     # VA-API драйвер для аппаратного декодирования (NVIDIA)
env = XDG_SESSION_TYPE,wayland                     # Тип сессии — Wayland
env = GBM_BACKEND,nvidia-drm                       # Бэкенд GBM для NVIDIA (управление буферами кадров)
env = __GLX_VENDOR_LIBRARY_NAME,nvidia             # Библиотека GLX (NVIDIA)
env = WLR_NO_HARDWARE_CURSORS,1                    # Отключить аппаратный курсор (исправление артефактов)

# ===== ДОПОЛНИТЕЛЬНЫЕ ПЕРЕМЕННЫЕ ДЛЯ УСТРАНЕНИЯ ПРОБЛЕМ =====
# Вспомогательные настройки, повышающие стабильность и совместимость.
env = AQ_NO_MODIFIERS,1                            # Отключает DRM-модификаторы (решает многие проблемы совместимости)
env = __GL_GSYNC_ALLOWED,1                         # Включает поддержку G-SYNC (адаптивная синхронизация NVIDIA)
env = __GL_VRR_ALLOWED,1                           # Включает Variable Refresh Rate (VRR)

# ===== МОНИТОРЫ =====
# См. https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto                       # Автоопределение разрешения, частоты и позиции монитора

# ===== МОИ ПРОГРАММЫ (ПЕРЕМЕННЫЕ С ПУТЯМИ/КОМАНДАМИ) =====
# См. https://wiki.hypr.land/Configuring/Keywords/
$terminal = kitty                                   # Терминал по умолчанию (kitty)
$fileManager = dolphin                              # Файловый менеджер (Dolphin)
$menu = wofi --show drun                            # Лаунчер приложений (wofi в режиме drun — показывать .desktop-файлы)
$browser = firefox                                  # Браузер (Firefox)
$code = code                                        # Редактор кода (VS Code / VSCodium)
$libreoffice = libreoffice                          # Офисный пакет LibreOffice
$obsidian = obsidian                                # Приложение Obsidian (заметки)
$telegram = Telegram                                # Мессенджер Telegram (имя исполняемого файла)

# ===== АВТОЗАПУСК =====
# Команды, выполняемые однократно при старте Hyprland.
exec-once = waybar & hyprpaper & playerctld daemon $ yandex-music $ hyprpolkitagent        # Запуск: панель waybar, обои hyprpaper, демон управления плеером, Яндекс.Музыка, агент polkit

# ===== ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (КУРСОР) =====
# Настройки размера и темы курсора.
env = XCURSOR_SIZE,24                             # Размер курсора XCursor (для XWayland-приложений)
env = HYPRCURSOR_SIZE,24                            # Размер курсора Hyprcursor (нативный курсор Hyprland)

# ===== ВНЕШНИЙ ВИД (LOOK AND FEEL) =====

# ---------- ОБЩИЕ ----------
general {
    gaps_in = 2.5                                    # Внутренние отступы окон (между содержимым и рамкой)
    gaps_out = 10                                    # Внешние отступы между окнами и границами экрана
    border_size = 2                                  # Толщина рамки окна в пикселях
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg   # Цвет активной рамки: градиент от полупрозрачного голубого к зелёному
    col.inactive_border = rgba(595959aa)             # Цвет неактивной рамки: полупрозрачный тёмно-серый
    resize_on_border = false                         # Запрет изменения размера окна перетаскиванием рамки
    allow_tearing = false                            # Разрывы кадров запрещены (вертикальная синхронизация)
    layout = dwindle                                 # Раскладка окон: dwindle — динамическая плитка с возможностью вложенных разделений
}

# ---------- ДЕКОРАЦИИ ----------
decoration {
    rounding = 10                                    # Радиус скругления углов окон
    rounding_power = 4                               # Степень скругления (чем выше, тем более плавная кривая)
    active_opacity = 0.97                           # Прозрачность активного окна (1.0 — полностью непрозрачное)
    inactive_opacity = 0.97                          # Прозрачность неактивных окон

    shadow {
        enabled = true                               # Включить тени под окнами
        range = 4                                   # Дальность распространения тени
        render_power = 3                            # Интенсивность рендеринга тени (влияет на размытие)
        color = rgba(1a1a1aee)                      # Цвет тени: почти чёрный с прозрачностью
    }

    blur {
        enabled = true                               # Включить размытие фона под окнами (эффект матового стекла)
        size = 3                                    # Радиус размытия
        passes = 1                                  # Количество проходов размытия (качество)
        vibrancy = 0.1696                           # Насыщенность размытого фона (0 — серый, 1 — сохранять цвета)
    }
}

# ---------- АНИМАЦИИ ----------
animations {
    enabled = yes, please :)                         # Включить анимации (да, пожалуйста — шутливый синтаксис)
    # Предопределённые кривые (bezier) для использования в настройках анимаций
    bezier = easeOutQuint,   0.23, 1,    0.32, 1              # Кривая easeOutQuint: плавное завершение с ускорением в конце
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1              # Кривая easeInOutCubic: плавное начало и завершение
    bezier = linear,         0,    0,    1,    1               # Линейная кривая: равномерное изменение без ускорения
    bezier = almostLinear,   0.5,  0.5,  0.75, 1               # Почти линейная кривая с лёгким замедлением в конце
    bezier = quick,          0.15, 0,    0.1,  1               # Быстрая кривая: резкое начало и долгое завершение

    # Глобальные и частные анимации (имя, включена, скорость, кривая, [стиль])
    animation = global,        1,     10,    default                      # Глобальный множитель скорости (общая длительность всех анимаций)
    animation = border,        1,     5.39,  easeOutQuint                 # Анимация изменения цвета границ окон
    animation = windows,       1,     4.79,  easeOutQuint                 # Анимация перемещения и изменения размера окон
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%      # Появление окна (popin — выезд с масштабированием)
    animation = windowsOut,    1,     1.49,  linear,       popin 87%      # Исчезновение окна
    animation = fadeIn,        1,     1.73,  almostLinear                 # Плавное появление элементов (общее)
    animation = fadeOut,       1,     1.46,  almostLinear                 # Плавное исчезновение элементов (общее)
    animation = fade,          1,     3.03,  quick                        # Универсальная анимация исчезновения/появления
    animation = layers,        1,     3.81,  easeOutQuint                 # Анимация всплывающих слоёв (меню, уведомления)
    animation = layersIn,      1,     4,     easeOutQuint, fade           # Появление слоя с затуханием
    animation = layersOut,     1,     1.5,   linear,       fade           # Исчезновение слоя с затуханием
    animation = fadeLayersIn,  1,     1.79,  almostLinear                # Плавное появление слоя (альтернативный вариант)
    animation = fadeLayersOut, 1,     1.39,  almostLinear                # Плавное исчезновение слоя (альтернативный вариант)
    animation = workspaces,    1,     1.94,  almostLinear, fade           # Анимация переключения рабочих столов
    animation = workspacesIn,  1,     1.21,  almostLinear, fade          # Появление нового рабочего стола
    animation = workspacesOut, 1,     1.94,  almostLinear, fade          # Исчезновение покидаемого рабочего стола
    animation = zoomFactor,    1,     7,     quick                        # Анимация изменения масштаба (зума) при жестах/командах
}

# ---------- РАСКЛАДКИ ----------
#dwindle {
    # pseudotile = true         # Включает псевдо-плитку (активируется по mainMod + P, позволяет имитировать плавающие окна)
    # preserve_split = true     # Сохранять ручное разделение окон при добавлении/перемещении новых окон
#}

master {
    new_status = master       # Новые окна всегда становятся главным (master), помещая остальные в стек
}

# ---------- ПРОЧЕЕ ----------
misc {
    force_default_wallpaper = -1   # -1 — не принуждать обои (оставить стандартное поведение Hyprland)
    disable_hyprland_logo = false  # false — показывать аниме-талисман при старте (true, чтобы скрыть)
}

# ===== ВВОД =====
input {
    kb_layout = us,ru                                     # Раскладки клавиатуры: английская (us) и русская (ru)
    kb_variant =                                          # Вариант раскладки (пусто — стандартная, без дополнительных модификаций)
    kb_model =                                            # Модель клавиатуры (пусто — автоматическое определение)
    kb_options =grp:alt_shift_toggle                     # Переключение раскладки по Alt+Shift (или правый Alt)
    kb_rules =                                            # Правила xkb (пусто — используются стандартные)
    follow_mouse = 1                                      # Фокус следует за мышью (1 — да, 0 — только по клику)
    sensitivity = 0                                       # Чувствительность мыши (0 — системная скорость без изменений)

    touchpad {
        natural_scroll = false                            # Обычная прокрутка: движение пальцев вниз прокручивает содержимое вниз (не натуральная)
    }

}

# Жесты на тачпаде
gesture = 3, horizontal, workspace                       # Три пальца, горизонтальный свайп → переключение рабочих столов

# Настройки конкретного устройства ввода (при необходимости раскомментировать и указать имя)
device {
    name = epic-mouse-v1                                 # Имя устройства (мышь)
    sensitivity = -0.75                                  # Относительное изменение чувствительности (-0.75 = уменьшить)
}


# ===== ГОРЯЧИЕ КЛАВИШИ =====
$mainMod = SUPER                   # Основная клавиша-модификатор (обычно клавиша Windows)

# ---------- Запуск приложений ----------
bind = $mainMod, Q, exec, $terminal                                              # Win + Q: Открыть терминал
bind = $mainMod, C, exec, $code                                                  # Win + C: Открыть редактор кода
bind = $mainMod, W, killactive,                                                  # Win + W: Закрыть активное окно
bind = $mainMod, ESCAPE, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit   # Win + Esc: Завершить сеанс (через hyprshutdown или стандартный выход)
bind = $mainMod, E, exec, $fileManager                                           # Win + E: Открыть файловый менеджер
bind = $mainMod, B, exec, $browser                                               # Win + B: Открыть браузер
# bind = $mainMod, V, toggleflo22ating,                                          # Закомментировано: переключение плавающего режима окна
bind = $mainMod, R, exec, $menu                                                  # Win + R: Запустить лаунчер приложений (wofi)
# bind = $mainMod, P, pseudo,                                                    # Закомментировано: переключение псевдо-плитки в dwindle
# bind = $mainMod, L, exec, $libreoffices                                        # Закомментировано: запуск LibreOffice
bind = $mainMod, O, exec, $obsidian2                                             # Win + O: Открыть Obsidian (заметки)
bind = $mainMod, T, exec, $telegram                                              # Win + T: Открыть Telegram
bind = $mainMod, L, exec, hyprctl hyprpaper wallpaper eDP-2,"$(find ~/Pictures/Wallpapers/ -type f | shuf -n 1)"  # Win + L: Установить случайные обои из папки ~/Pictures/Wallpapers/
# bind = $mainMod, F11, exec, hyprctl keyword device:asup1205:00-093a:2008-touchpad:enabled true && notify-send "Тачпад" "Включён"
# bind = $mainMod, F12, exec, hyprctl keyword device:asup1205:00-093a:2008-touchpad:enabled false && notify-send "Тачпад" "Отключён"

# ---------- Управление окнами в dwindle ----------
bind = $mainMod, J, layoutmsg, togglesplit                                       # Win + J: Переключить направление разделения окна (горизонтальное ↔ вертикальное)

# ---------- Фокус стрелками ----------
 bind = $mainMod, left, movefocus, l                                              # Win + ←: Переместить фокус на окно слева
 bind = $mainMod, right, movefocus, r                                             # Win + →: Переместить фокус на окно справа
 bind = $mainMod, up, movefocus, u                                                # Win + ↑: Переместить фокус на окно сверху
 bind = $mainMod, down, movefocus, d                                              # Win + ↓: Переместить фокус на окно снизу

# ---------- Переключение рабочих столов (workspace 1-10) ----------
bind = $mainMod, 1, workspace, 1                                                 # Win + 1: Перейти на рабочий стол 1
bind = $mainMod, 2, workspace, 2                                                 # Win + 2: Перейти на рабочий стол 2
bind = $mainMod, 3, workspace, 3                                                 # Win + 3: Перейти на рабочий стол 3
bind = $mainMod, 4, workspace, 4                                                 # Win + 4: Перейти на рабочий стол 4
bind = $mainMod, 5, workspace, 5                                                 # Win + 5: Перейти на рабочий стол 5
bind = $mainMod, 6, workspace, 6                                                 # Win + 6: Перейти на рабочий стол 6
bind = $mainMod, 7, workspace, 7                                                 # Win + 7: Перейти на рабочий стол 7
bind = $mainMod, 8, workspace, 8                                                 # Win + 8: Перейти на рабочий стол 8
bind = $mainMod, 9, workspace, 9                                                 # Win + 9: Перейти на рабочий стол 9
bind = $mainMod, 0, workspace, 10                                                # Win + 0: Перейти на рабочий стол 10

# ---------- Перемещение активного окна на рабочий стол 1-10 (с зажатым Shift) ----------
bind = $mainMod SHIFT, 1, movetoworkspace, 1                                     # Win + Shift + 1: Переместить окно на 1-й рабочий стол
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                     # Win + Shift + 2: Переместить окно на 2-й рабочий стол
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                     # Win + Shift + 3: Переместить окно на 3-й рабочий стол
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                     # Win + Shift + 4: Переместить окно на 4-й рабочий стол
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                     # Win + Shift + 5: Переместить окно на 5-й рабочий стол
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                     # Win + Shift + 6: Переместить окно на 6-й рабочий стол
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                     # Win + Shift + 7: Переместить окно на 7-й рабочий стол
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                     # Win + Shift + 8: Переместить окно на 8-й рабочий стол
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                     # Win + Shift + 9: Переместить окно на 9-й рабочий стол
bind = $mainMod SHIFT, 0, movetoworkspace, 10                                    # Win + Shift + 0: Переместить окно на 10-й рабочий стол

# ---------- Прокрутка рабочих столов колёсиком мыши ----------
bind = $mainMod, mouse_down, workspace, e+1                                      # Win + колёсико вниз: следующий рабочий стол
bind = $mainMod, mouse_up, workspace, e-1                                        # Win + колёсико вверх: предыдущий рабочий стол

# ---------- Перемещение и изменение размера окон мышью ----------
bindm = $mainMod, mouse:272, movewindow                                           # Win + левая кнопка мыши: перетаскивать окно
bindm = $mainMod, mouse:273, resizewindow                                         # Win + правая кнопка мыши: изменять размер окна

# ===== МУЛЬТИМЕДИЙНЫЕ КЛАВИШИ =====
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+   # Клавиша увеличения громкости: +5%, лимит 100%
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-         # Клавиша уменьшения громкости: -5%
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                # Клавиша выключения звука: переключить mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle           # Клавиша выключения микрофона: переключить mute
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+                       # Клавиша увеличения яркости: +5% (с плавным переходом)
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-                     # Клавиша уменьшения яркости: -5%

# ---------- Shift + стрелки – управление Яндекс Музыкой через playerctl ----------
bindl = SHIFT, UP,    exec, playerctl pause    # Shift + ↑: Поставить текущий трек на паузу
bindl = SHIFT, DOWN,  exec, playerctl play     # Shift + ↓: Снять с паузы (возобновить воспроизведение)
bindl = SHIFT, LEFT,  exec, playerctl previous # Shift + ←: Предыдущий трек
bindl = SHIFT, RIGHT, exec, playerctl next     # Shift + →: Следующий трек

# ===== СКРИНШОТЫ =====
bind = , Print, exec, grim ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S.png') && notify-send "Скриншот" "Полный экран сохранён"
# Print Screen: скриншот всего экрана, сохраняется с датой и временем, выводится уведомление

bind = $mainMod SHIFT, W, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S.png') && notify-send "Скриншот" "Область сохранена"
# Win + Shift + W: выбрать область экрана (slurp) и сохранить её в файл

bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Скриншот" "Область скопирована в буфер"
# Win + Ctrl + S: выбрать область и скопировать её в буфер обмена (без сохранения в файл)

bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f - && notify-send "Swappy" "Редактор открыт"
# Win + Shift + S: выбрать область и открыть её в редакторе скриншотов Swappy

# ===== ПРАВИЛА ДЛЯ ОКОН =====

# Подавить события максимизации для всех окон
windowrule {
    name = suppress-maximize-events                   # Имя правила (уникальное, для идентификации)
    match:class = .*                                  # Применять ко всем классам окон (любое имя процесса)
    suppress_event = maximize                         # Игнорировать события максимизации окна
}

# Исправить перетаскивание в XWayland-окнах (чтобы не терялся фокус)
windowrule {
    name = fix-xwayland-drags                        # Имя правила
    match:class = ^$                                 # Класс окна не указан (любой)
    match:title = ^$                                 # Заголовок окна не указан (любой)
    match:xwayland = true                            # Применять только к XWayland-окнам
    match:float = true                               # Окно должно быть в плавающем режиме
    match:fullscreen = false                         # Не применять к полноэкранным окнам
    match:pin = false                                # Не применять к закреплённым окнам
    no_focus = true                                  # Не фокусироваться на окне при перетаскивании (предотвращает мерцание/потерю фокуса)
}

# Окно hyprland-run: сделать плавающим и переместить в нижний правый угол
windowrule {
    name = move-hyprland-run                         # Имя правила
    match:class = hyprland-run                       # Применять только к окнам с классом hyprland-run (лаунчер hyprland-run)
    move = 20 monitor_h-120                          # Позиция: от левого края 20 пикселей, от нижнего края монитора 120 пикселей
    float = yes                                      # Перевести окно в плавающий режим
}
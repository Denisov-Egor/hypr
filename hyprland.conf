# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG — полностью прокомментирован (каждая строка)
# #######################################################################################

# ===== ОБЯЗАТЕЛЬНЫЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (NVIDIA) =====
env = LIBVA_DRIVER_NAME,nvidia                     # VA-API драйвер для аппаратного декодирования (NVIDIA)
env = XDG_SESSION_TYPE,wayland                     # Тип сессии — Wayland
env = GBM_BACKEND,nvidia-drm                       # Бэкенд GBM для NVIDIA
env = __GLX_VENDOR_LIBRARY_NAME,nvidia             # Библиотека GLX (NVIDIA)
env = WLR_NO_HARDWARE_CURSORS,1                    # Отключить аппаратный курсор (исправление артефактов)

# ===== ДОПОЛНИТЕЛЬНЫЕ ПЕРЕМЕННЫЕ ДЛЯ УСТРАНЕНИЯ ПРОБЛЕМ =====
env = AQ_NO_MODIFIERS,1                            # Отключает DRM-модификаторы (решает многие проблемы совместимости)
env = __GL_GSYNC_ALLOWED,1                         # Включает поддержку G-SYNC
env = __GL_VRR_ALLOWED,1                           # Включает Variable Refresh Rate (VRR)

# ===== МОНИТОРЫ =====
# См. https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto                       # Автоопределение разрешения и частоты, позиция по умолчанию

# ===== МОИ ПРОГРАММЫ =====
# См. https://wiki.hypr.land/Configuring/Keywords/
$terminal = kitty                                   # Терминал по умолчанию
$fileManager = dolphin                              # Файловый менеджер
$menu = wofi --show drun                            # Лаунчер приложений (wofi в режиме drun)
$browser = firefox                                  # Браузер
$code = code                                        # Редактор кода (VS Code / VSCodium)
$libreoffice = libreoffice
$obsidian = obsidian
$telegram = Telegram

# ===== АВТОЗАПУСК =====
exec-once = waybar & hyprpaper & playerctld daemon $ yandex-music $ hyprpolkitagent        # Запуск при стартe

# ===== ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (КУРСОР) =====
env = XCURSOR_SIZE,24                             # Размер курсора XCursor
env = HYPRCURSOR_SIZE,24                            # Размер курсора Hyprcursor

# ===== ВНЕШНИЙ ВИД (LOOK AND FEEL) =====

# ---------- ОБЩИЕ ----------
general {
    gaps_in = 2.5                                    # Внутренние отступы окон
    gaps_out = 10                                    # Внешние отступы между окнами
    border_size = 2                                  # Толщина рамки окна
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg   # Цвет активной рамки (градиент)
    col.inactive_border = rgba(595959aa)             # Цвет неактивной рамки
    resize_on_border = false                         # Запрет изменения размера перетаскиванием рамки
    allow_tearing = false                            # Разрывы кадров запрещены
    layout = dwindle                                 # Раскладка окон (dwindle — динамическая плитка)
}

# ---------- ДЕКОРАЦИИ ----------
decoration {
    rounding = 10                                    # Радиус скругления углов окон
    rounding_power = 4                               # Степень скругления (чем выше, тем плавнее)
    active_opacity = 0.97                           # Прозрачность активного окна (1.0 = полностью непрозрачное)
    inactive_opacity = 0.97                           # Прозрачность неактивных окон

    shadow {
        enabled = true                               # Включить тени окон
        range = 4                                   # Дальность распространения тени
        render_power = 3                            # Интенсивность рендеринга тени
        color = rgba(1a1a1aee)                      # Цвет тени (тёмно-серый, почти чёрный)
    }

    blur {
        enabled = true                               # Включить размытие под окнами
        size = 3                                    # Радиус размытия
        passes = 1                                  # Количество проходов размытия
        vibrancy = 0.1696                           # Насыщенность размытого фона
    }
}

# ---------- АНИМАЦИИ ----------
animations {
    enabled = yes, please :)                         # Включить анимации (да, пожалуйста)
    # Кривые анимаций (bezier)
    bezier = easeOutQuint,   0.23, 1,    0.32, 1              # Кривая easeOutQuint (плавное завершение)
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1              # Кривая easeInOutCubic (плавно в начале и конце)
    bezier = linear,         0,    0,    1,    1               # Линейная кривая (равномерное изменение)
    bezier = almostLinear,   0.5,  0.5,  0.75, 1               # Почти линейная кривая с лёгким ускорением
    bezier = quick,          0.15, 0,    0.1,  1               # Быстрая кривая с акцентом на начало

    # Глобальные анимации (ИМЯ, ВКЛ/ВЫКЛ, СКОРОСТЬ, КРИВАЯ, [СТИЛЬ])
    animation = global,        1,     10,    default                      # Глобальная скорость анимаций (общий множитель)
    animation = border,        1,     5.39,  easeOutQuint                 # Анимация изменения цвета границы
    animation = windows,       1,     4.79,  easeOutQuint                 # Анимация перемещения/изменения размера окон
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%      # Появление окна
    animation = windowsOut,    1,     1.49,  linear,       popin 87%      # Исчезновение окна
    animation = fadeIn,        1,     1.73,  almostLinear                 # Плавное появление (общее)
    animation = fadeOut,       1,     1.46,  almostLinear                 # Плавное исчезновение (общее)
    animation = fade,          1,     3.03,  quick                        # Затухание/появление всего
    animation = layers,        1,     3.81,  easeOutQuint                 # Анимация всплывающих слоёв
    animation = layersIn,      1,     4,     easeOutQuint, fade           # Появление слоя
    animation = layersOut,     1,     1.5,   linear,       fade           # Исчезновение слоя
    animation = fadeLayersIn,  1,     1.79,  almostLinear                # Плавное появление слоя (другой параметр)
    animation = fadeLayersOut, 1,     1.39,  almostLinear                # Плавное исчезновение слоя
    animation = workspaces,    1,     1.94,  almostLinear, fade           # Переключение рабочих столов
    animation = workspacesIn,  1,     1.21,  almostLinear, fade          # Появление нового рабочего стола
    animation = workspacesOut, 1,     1.94,  almostLinear, fade          # Исчезновение покинутого рабочего стола
    animation = zoomFactor,    1,     7,     quick                        # Анимация изменения масштаба (зума)
}

# ---------- РАСКЛАДКИ ----------
#dwindle {
    pseudotile = true         # Включает псевдо-плитку (активируется по mainMod + P)
    preserve_split = true     # Сохранять ручное разделение окон при перемещениях
#}

master {
    new_status = master       # Новые окна становятся главными в мастер-стеке
}

# ---------- ПРОЧЕЕ ----------
misc {
    force_default_wallpaper = -1   # -1 — не принуждать обои (оставить стандартное поведение)
    disable_hyprland_logo = false  # false — показывать аниме-талисман (true, чтобы скрыть)
}

# ===== ВВОД =====
input {
    kb_layout = us,ru                                     # Раскладки клавиатуры: английская и русская
    kb_variant =                                          # Вариант раскладки (пусто — стандартная)
    kb_model =                                            # Модель клавиатуры (пусто — авто)
    kb_options =grp:alt_shift_toggle                     # Переключение раскладки по Alt+Shift
    kb_rules =                                            # Правила xkb (пусто — по умолчанию)
    follow_mouse = 1                                      # Фокус следует за мышью (1 — да, 0 — по клику)
    sensitivity = 0                                       # Чувствительность мыши (0 — без изменений)

    touchpad {
        natural_scroll = false                            # Обычная прокрутка (не натуральная)
 	}

}

# Жесты (свайп тремя пальцами по горизонтали переключает рабочие столы)
gesture = 3, horizontal, workspace                       # Три пальца, горизонтальный свайп → смена workspace

# Настройки конкретного устройства (пример)
device {
    name = epic-mouse-v1                                  # Имя устройства (заменить на своё)
    sensitivity = -0.75                                    # Пониженная чувствительность для этой мыши
}

# ===== ГОРЯЧИЕ КЛАВИШИ =====
$mainMod = SUPER                   # Основная клавиша-модификатор (Windows)

# Запуск приложений
bind = $mainMod, Q, exec, $terminal                                              # Открыть терминал
bind = $mainMod, C, exec, $code                                                  # Открыть редактор кода
bind = $mainMod, W, killactive,                                                  # Закрыть активное окно
bind = $mainMod, ESCAPE, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit   # Завершение сеанса
bind = $mainMod, E, exec, $fileManager                                           # Открыть файловый менеджер
bind = $mainMod, B, exec, $browser                                               # Открыть браузерa
# bind = $mainMod, V, togglefloating,                                              # Вкл/выкл плавающий режим для окна
bind = $mainMod, R, exec, $menu                                                  # Запустить лаунчер (меню)
# bind = $mainMod, P, pseudo,                                                      # Переключить псевдо-плитку (dwindle)
# bind = $mainMod, L, exec, $libreoffice
bind = $mainMod, O, exec, $obsidian
bind = $mainMod, T, exec, $telegram
bind = $mainMod, L, exec, hyprctl hyprpaper wallpaper eDP-2,"$(find ~/Pictures/Wallpapers/ -type f | shuf -n 1)"  # Win + L: Случайные обои из вашей папки

# Управление окнами в dwindle
bind = $mainMod, J, layoutmsg, togglesplit                                       # Изменить направление разделения (горизонтальное/вертикальное)

# Фокус стрелками
 bind = $mainMod, left, movefocus, l                                              # Фокус влево
 bind = $mainMod, right, movefocus, r                                             # Фокус вправо
 bind = $mainMod, up, movefocus, u                                                # Фокус вверх
 bind = $mainMod, down, movefocus, d                                              # Фокус вниз

# Переключение рабочих столов (workspace 1-10)
bind = $mainMod, 1, workspace, 1                                                 # Перейти на рабочий стол 1
bind = $mainMod, 2, workspace, 2                                                 # Перейти на рабочий стол 2
bind = $mainMod, 3, workspace, 3                                                 # Перейти на рабочий стол 3
bind = $mainMod, 4, workspace, 4                                                 # Перейти на рабочий стол 4
bind = $mainMod, 5, workspace, 5                                                 # Перейти на рабочий стол 5
bind = $mainMod, 6, workspace, 6                                                 # Перейти на рабочий стол 6
bind = $mainMod, 7, workspace, 7                                                 # Перейти на рабочий стол 7
bind = $mainMod, 8, workspace, 8                                                 # Перейти на рабочий стол 8
bind = $mainMod, 9, workspace, 9                                                 # Перейти на рабочий стол 9
bind = $mainMod, 0, workspace, 10                                                # Перейти на рабочий стол 10

# Перемещение активного окна на рабочий стол 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1                                     # Переместить окно на 1-й стол
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                     # Переместить окно на 2-й стол
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                     # Переместить окно на 3-й стол
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                     # Переместить окно на 4-й стол
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                     # Переместить окно на 5-й стол
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                     # Переместить окно на 6-й стол
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                     # Переместить окно на 7-й стол
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                     # Переместить окно на 8-й стол
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                     # Переместить окно на 9-й стол
bind = $mainMod SHIFT, 0, movetoworkspace, 10                                    # Переместить окно на 10-й стол

# Прокрутка рабочих столов колёсиком мыши
bind = $mainMod, mouse_down, workspace, e+1                                      # Колёсико вниз → следующий стол
bind = $mainMod, mouse_up, workspace, e-1                                        # Колёсико вверх → предыдущий стол

# Перемещение и изменение размера окон мышью
bindm = $mainMod, mouse:272, movewindow                                           # Зажать mainMod + левая кнопка мыши — двигать окно
bindm = $mainMod, mouse:273, resizewindow                                         # Зажать mainMod + правая кнопка мыши — изменять размер

# ===== МУЛЬТИМЕДИЙНЫЕ КЛАВИШИ =====
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+   # Увеличить громкость на 5%
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-         # Уменьшить громкость на 5%
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                # Выкл/вкл звук
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle           # Выкл/вкл микрофон
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+                       # Увеличить яркость на 5%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-                     # Уменьшить яркость на 5%

# Shift + стрелки – управление Яндекс Музыкой через playerctl
bindl = SHIFT, UP,    exec, playerctl pause    # Поставить на паузу
bindl = SHIFT, DOWN,  exec, playerctl play     # Снять с паузы (воспроизвести)
bindl = SHIFT, LEFT,  exec, playerctl previous # Предыдущий трек
bindl = SHIFT, RIGHT, exec, playerctl next     # Следующий трек   # Предыдущий трек

# ===== СКРИНШОТЫ =====
bind = , Print, exec, grim ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S.png') && notify-send "Скриншот" "Полный экран сохранён"
# Print Screen — скриншот всего экрана и уведомление

bind = $mainMod SHIFT, W, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S.png') && notify-send "Скриншот" "Область сохранена"
# SUPER+Shift+W — выделенная область сохраняется в файл

bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Скриншот" "Область скопирована в буфер"
# SUPER+Ctrl+S — выделенная область копируется в буфер обмена

bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f - && notify-send "Swappy" "Редактор открыт"
# SUPER+Shift+S — выделенная область открывается в редакторе Swappy

# ===== ПРАВИЛА ДЛЯ ОКОН =====

# Подавить события максимизации для всех окон
windowrule {
    name = suppress-maximize-events                   # Имя правила (для идентификации)
    match:class = .*                                  # Применять ко всем классам окон
    suppress_event = maximize                         # Игнорировать события максимизации
}

# Исправить перетаскивание в XWayland-окнах
windowrule {
    name = fix-xwayland-drags                        # Имя правила
    match:class = ^$                                 # Класс окна не указан (любой)
    match:title = ^$                                 # Заголовок не указан
    match:xwayland = true                            # Только для XWayland-окон
    match:float = true                               # Окно должно быть плавающим
    match:fullscreen = false                         # Не в полноэкранном режиме
    match:pin = false                                # Не закреплено
    no_focus = true                                  # Не фокусироваться при перетаскивании
}

# Окно hyprland-run: сделать плавающим и переместить вниз справа
windowrule {
    name = move-hyprland-run                         # Имя правила
    match:class = hyprland-run                       # Применять только к классу hyprland-run
    move = 20 monitor_h-120                          # Позиция: отступ слева 20, от низа 120 пикселей
    float = yes                                      # Сделать окно плавающим
}

